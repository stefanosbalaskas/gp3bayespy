site_name: gp3bayespy
site_description: Contract-first Bayesian workflows for hierarchical behavioural data in Python.
site_author: Stefanos Balaskas
site_url: https://stefanosbalaskas.github.io/gp3bayespy/

repo_url: https://github.com/stefanosbalaskas/gp3bayespy
repo_name: stefanosbalaskas/gp3bayespy
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Stefanos Balaskas

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/favicon.svg
  icon:
    logo: material/chart-line
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Get started:
      - Getting started: getting-started.md
      - Executable examples: examples/index.md
      - Migration from R: migration.md
  - Workflows:
      - Binary models: articles/binary-end-to-end.md
      - Duration models: articles/duration-end-to-end.md
      - Predictive diagnostics: articles/advanced-predictive-diagnostics.md
      - PSIS-LOO & comparison: articles/loo-influence-and-model-comparison.md
      - Sensitivity & recovery: articles/sensitivity-evidence-workflow.md
      - Dynamic pupillometry: articles/bayesian-dynamic-pupillometry.md
      - Reproducibility: articles/reproducible-analysis-manifests.md
  - Learn:
      - Article library: articles/index.md
      - Plot gallery: plot-gallery.md
  - Reference:
      - API reference: reference/index.md
  - Project:
      - Citation: citation.md
      - Release v0.5.0: release.md
      - Governance: governance.md
      - R → Python parity: development/parity.md

not_in_nav: |
  /articles/*.md
  /reference/*.md
  /api.md
  /404.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stefanosbalaskas/gp3bayespy
      name: gp3bayespy on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/gp3bayespy/
      name: gp3bayespy on PyPI
    - icon: fontawesome/brands/r-project
      link: https://cran.r-project.org/package=gp3bayes
      name: gp3bayes R reference
    - icon: fontawesome/solid/fingerprint
      link: https://doi.org/10.5281/zenodo.22150746
      name: gp3bayespy DOI on Zenodo
