name: Release

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  build:
    name: Build and validate release distributions
    if: >-
      (github.event_name == 'release' &&
       !github.event.release.prerelease && !github.event.release.draft) ||
      (github.event_name == 'push' &&
       github.event.head_commit.message == 'publish: gp3bayespy 0.6.2 from immutable tag')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || 'v0.6.2' }}
          persist-credentials: false

      - name: Verify immutable GitHub release and no existing PyPI version for recovery
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          TAG_SHA="$(git rev-parse "refs/tags/v0.6.2^{commit}")"
          gh release view "v0.6.2" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName \
            --jq 'select(.isDraft == false and .isPrerelease == false and .tagName == "v0.6.2") | .tagName' | grep -Fx 'v0.6.2'
          echo "Validated existing immutable v0.6.2 at $TAG_SHA"
          python - <<'PY'
          import urllib.error, urllib.request
          try:
              urllib.request.urlopen("https://pypi.org/pypi/gp3bayespy/0.6.2/json", timeout=20)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          else:
              raise SystemExit("gp3bayespy 0.6.2 already on PyPI: refuse duplicate upload")
          PY

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Verify release tag matches package version
        shell: python
        run: |
          import pathlib
          import tomllib

          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text()
          )["project"]["version"]

          expected = f"v{version}"
          actual = "${{ github.event.release.tag_name || 'v0.6.2' }}"

          if actual != expected:
              raise SystemExit(
                  f"Release tag {actual!r} does not match "
                  f"package version {expected!r}."
              )

          print("Release tag/version contract: PASS")

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Smoke-test exact wheel
        shell: bash
        run: |
          python -m venv .release-smoke
          . .release-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python - <<'PY'
          from importlib.metadata import version
          import gp3bayespy

          expected = "${{ github.event.release.tag_name || 'v0.6.2' }}".removeprefix("v")

          assert version("gp3bayespy") == expected

          required = [
              "specify_multilevel_gaze_mediation",
              "fit_multilevel_gaze_mediation",
              "posterior_indirect_effect",
              "report_multilevel_gaze_mediation",
          ]

          missing = [
              name
              for name in required
              if not hasattr(gp3bayespy, name)
          ]

          assert not missing, missing

          print("Exact wheel smoke test: PASS")
          PY

      - name: Generate SHA-256 sums
        shell: bash
        run: sha256sum dist/* > SHA256SUMS.txt

      - name: Upload exact distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Attach exact distributions to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name || 'v0.6.2' }}" \
            dist/* \
            SHA256SUMS.txt \
            --clobber

  publish:
    name: Publish exact distributions to PyPI
    if: >-
      (github.event_name == 'release' &&
       !github.event.release.prerelease && !github.event.release.draft) ||
      (github.event_name == 'push' &&
       github.event.head_commit.message == 'publish: gp3bayespy 0.6.2 from immutable tag')
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/gp3bayespy/

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
