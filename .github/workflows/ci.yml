name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev,plots]"
      - run: ruff check .
      - run: mypy src/gp3bayespy
      - run: pytest --cov=gp3bayespy --cov-branch --cov-report=term-missing --cov-fail-under=80
      - run: python -m build
      - run: python examples/backend_status.py
      - run: python examples/binary_workflow.py
      - run: python examples/duration_workflow.py
      - run: python examples/predictive_diagnostics.py
      - run: python examples/pupil_workflow.py
      - run: python examples/loo_model_comparison.py
      - run: python examples/sensitivity_workflow.py
      - run: python examples/reproducibility_workflow.py

  all-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[all]"
      - run: ruff check .
      - run: mypy src/gp3bayespy
      - run: pytest
      - run: python -m build
      - run: mkdocs build --strict
      - run: python dev/site_audit.py site
