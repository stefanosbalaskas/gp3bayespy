[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gp3bayespy"
version = "0.1.0.dev0"
description = "Contract-first Bayesian workflows for hierarchical behavioural data in Python, ported from gp3bayes 0.5.0."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Stefanos Balaskas" }]
keywords = ["bayesian", "hierarchical-models", "repeated-measures", "pupillometry", "behavioural-data"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
]

[project.optional-dependencies]
bayes = [
  "arviz>=0.18,<1; python_version < '3.12'",
  "pymc>=5.10,<6; python_version < '3.12'",
  "arviz>=1.0; python_version >= '3.12'",
  "pymc>=6.3.1; python_version >= '3.12'",
  "cmdstanpy>=1.2",
  "xarray>=2024.1",
]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6", "mypy>=1.10", "build>=1.2", "twine>=5"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
all = ["gp3bayespy[bayes,plots,dev,docs]"]

[project.urls]
Homepage = "https://stefanosbalaskas.github.io/gp3bayespy/"
Repository = "https://github.com/stefanosbalaskas/gp3bayespy"
Issues = "https://github.com/stefanosbalaskas/gp3bayespy/issues"
"R reference" = "https://cran.r-project.org/package=gp3bayes"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gp3bayespy._reference" = ["*.json", "*.csv"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["gp3bayespy"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
